name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  go-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memlore
          POSTGRES_PASSWORD: memlore
          POSTGRES_DB: memlore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memlore -d memlore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Run migrations
        env:
          MEMLORE_POSTGRES_DSN: postgresql://memlore:memlore@localhost:5432/memlore
        run: go run ./cmd/memlore migrate

      - name: Go integration tests
        env:
          MEMLORE_POSTGRES_DSN: postgresql://memlore:memlore@localhost:5432/memlore
          MEMLORE_TEST_DATABASE_URL: postgresql://memlore:memlore@localhost:5432/memlore
        run: go test -tags=integration ./...

  graph-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install graph-service dependencies
        working-directory: graph-service
        run: uv sync --all-groups

      - name: Ruff check
        working-directory: graph-service
        run: uv run ruff check src tests

      - name: Ruff format
        working-directory: graph-service
        run: uv run ruff format --check src tests

      - name: Type check
        working-directory: graph-service
        run: uv run mypy

      - name: Tests
        working-directory: graph-service
        run: uv run pytest -m "not integration"
