services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memlore
      POSTGRES_PASSWORD: memlore
      POSTGRES_DB: memlore
    ports:
      - "15432:5432"
    volumes:
      - memlore_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memlore -d memlore"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/memlore-dev-password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - memlore_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  graph-service:
    build: ./graph-service
    ports:
      - "8090:8090"
    environment:
      MEMLORE_NEO4J_URI: bolt://neo4j:7687
      MEMLORE_NEO4J_USER: neo4j
      MEMLORE_NEO4J_PASSWORD: memlore-dev-password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      neo4j:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - memlore_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memlore_postgres:
  memlore_neo4j:
  memlore_redis:
